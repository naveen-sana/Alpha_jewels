spring.application.name=jewellery-backend

# Server Configuration (Render automatically injects PORT)
server.port=${PORT:9090}

# Database Configuration (Aiven PostgreSQL / Render)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecommerce_db}?sslmode=require}}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Security & JWT Configuration
app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-to-a-long-random-value-123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration (Comma-separated origins for production Vercel frontend)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://alpha-jewels.vercel.app,http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
