services:
  - type: web
      name: alpha-jewels-backend
          runtime: docker
              envVars:
                    - key: PORT
                            value: 10000
                                  - key: SPRING_JPA_HIBERNATE_DDL_AUTO
                                          value: update
                                                - key: CORS_ALLOWED_ORIGINS
                                                        sync: false
                                                              - key: DATABASE_URL
                                                                      sync: false
                                                                            - key: JWT_SECRET
                                                                                    generateValue: true
